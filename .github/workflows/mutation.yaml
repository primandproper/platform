---
on:
  workflow_dispatch:
  pull_request:
    paths:
      - '**/*.go'
      # A change to the gate runs the gate, the same way the coverage one does.
      # The timeout coefficient below is a number someone has to pick by hand,
      # and a pull request that lowers it back to where mutants time out on
      # build cost should go red here rather than on the next pull request to
      # touch Go source. For pull_request the filter reads the pull request's
      # own diff, so without these a change to the gate alone reports nothing.
      - .github/workflows/mutation.yaml
      - .scripts/mutation.sh

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

name: mutation
jobs:
  gremlins:
    # Above the deadline a warm run gives a mutant, so a hang is reported as
    # TIMED OUT by the gate rather than as a job that ran out of time with
    # nothing to say. See TIMEOUT_COEFFICIENT in .scripts/mutation.sh.
    timeout-minutes: 30
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # The survivors are posted as a pull request comment rather than gating the
      # merge; see .scripts/mutation.sh for why the gate is not blocking on them.
      pull-requests: write
    strategy:
      matrix:
        go-version: ['1.26.x']
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          # gremlins shells out to `git diff --merge-base <ref>`, which cannot
          # resolve the base branch out of a shallow clone.
          fetch-depth: 0

      - name: Install Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ matrix.go-version }}
          cache: true
          cache-dependency-path: go.sum

      # vendor/ is gitignored, and gremlins' coverage gathering fails outright on
      # inconsistent vendoring.
      - name: Vendor dependencies
        run: make vendor

      # The cache is here for wall-clock, and it is worth being exact about
      # which way it runs against the gate, because the obvious guess is
      # backwards. gremlins derives each mutant's deadline from how long the
      # coverage run took, and a warm cache is precisely what makes that run
      # quick — so restoring the cache makes the deadline *tighter*, not
      # looser. Measured on this repo: cold coverage takes about seven minutes
      # and leaves a deadline no mutant can reach, warm coverage takes sixteen
      # seconds and leaves one the first wave of workers overruns. See
      # TIMEOUT_COEFFICIENT in .scripts/mutation.sh for what the coefficient
      # therefore has to cover.
      #
      # Restore and save are separate steps so the save still runs when the job
      # fails. actions/cache saves only on success, and a failing gate is
      # exactly the state someone is about to iterate on — leaving them a cold
      # cache would add those seven minutes to every attempt.
      - name: Restore the mutation build cache
        id: gocache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/gremlins-gocache
          key: gremlins-gocache-${{ runner.os }}-${{ hashFiles('go.sum') }}
          restore-keys: gremlins-gocache-${{ runner.os }}-

      - name: Mutation testing
        run: |
          make mutate \
            GREMLINS_CACHE="${RUNNER_TEMP}/gremlins-gocache" \
            GREMLINS_DIFF_REF="origin/${GITHUB_BASE_REF:-main}"

      - name: Save the mutation build cache
        if: ${{ !cancelled() && steps.gocache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/gremlins-gocache
          key: gremlins-gocache-${{ runner.os }}-${{ hashFiles('go.sum') }}

      # Forked pull requests get a read-only token, so the comment would fail;
      # the survivors are still in the job log there.
      - name: Report survivors on the pull request
        if: >-
          !cancelled() &&
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./.scripts/mutation_comment.sh "${{ github.event.pull_request.number }}" artifacts/gremlins.json

      - name: Upload the mutation report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: gremlins-report
          path: artifacts/gremlins.json
          if-no-files-found: ignore
