---
on:
  workflow_dispatch:
  pull_request:
    paths:
      - '**/*.go'
      # A change to the gate runs the gate. The threshold below is a number
      # someone has to raise by hand, and a pull request that raises it past
      # what the module actually grades should go red here rather than on the
      # next pull request to touch Go source. For pull_request the filter reads
      # the pull request's own diff, so without this line a change to this file
      # alone reports nothing at all.
      - .github/workflows/tarp.yaml

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

name: tarp
jobs:
  tarp:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    permissions:
      # The report reaches the pull request as workflow commands the step writes
      # itself — annotations and the job summary — so nothing here calls the API
      # and a forked pull request's read-only token reports the same as any
      # other.
      contents: read
    strategy:
      matrix:
        go-version: ['1.27.x']
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ matrix.go-version }}
          cache: true
          cache-dependency-path: go.sum

      # An analysis is almost entirely go/packages loading the module, and what
      # that costs is decided by the Go build cache: 3m20s against a cold one,
      # 4s against a warm one. setup-go's cache does not serve it — that one is
      # keyed on go.sum and shared with every other job, whose entries this run
      # cannot reuse, which is why the first run here took three minutes with a
      # 1.16GB cache restored. A GOCACHE of its own is what keeps the job under
      # a minute.
      #
      # Restore and save are separate steps: actions/cache saves only on
      # success, and the run most in need of a warm cache is the one that
      # failed.
      - name: Restore the tarp build cache
        id: gocache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/tarp-gocache
          key: tarp-gocache-${{ runner.os }}-${{ hashFiles('go.sum') }}
          restore-keys: tarp-gocache-${{ runner.os }}-

      # The version is an exact tag rather than a floating major. tarp is pre-1.0
      # and its notion of what counts as a direct reference may tighten; a
      # stricter analyzer arriving on its own would fail a pull request that
      # changed nothing.
      - name: Find functions with no direct unit test
        uses: primandproper/tarpaulin@v0.1.0
        id: tarp
        env:
          GOCACHE: ${{ runner.temp }}/tarp-gocache
        with:
          package: ./...
          # The strictest of the three: a reference has to live in the test file
          # for the file that declares the function. The spread between this and
          # `any` is 12 points across the module, which says most of the gap is
          # genuinely untested rather than tested from somewhere else — so the
          # level that says the most costs little.
          strictness: file
          # A floor, deliberately well under the module's actual score rather
          # than pinned to it. This started as a ratchet at 61, which was the
          # score on the day it landed, and that turned out to be the wrong
          # shape for the measurement.
          #
          # The score is one integer over the whole module, and tarp has no
          # diff-scoped mode, so the gate cannot ask whether a pull request
          # made things worse — only whether the average moved. A branch adding
          # a well-tested package therefore trips it whenever that package's
          # own grade is below the module's, which is not a regression and is
          # not something its author should be asked to fix. The authorization
          # server is the case that showed it: 98.5% statement coverage, and 41%
          # here, because six HTTP endpoints are tested through the endpoints
          # rather than by a TestXxx naming each handler.
          #
          # So the number is what a collapse looks like, not what today looks
          # like. The module grades in the low sixties; 50 is the level at which
          # something has genuinely stopped being tested rather than a large
          # addition having a different shape from the average. Raise it as the
          # score climbs, and leave the same kind of headroom — nothing lowers
          # it automatically.
          #
          # A red run names the functions in the job summary; the fix is a test,
          # or a //tarp:ignore carrying its reason. The functions with no direct
          # test are still a backlog to pay down when files are touched for
          # other reasons; this gate is not what schedules that work.
          #
          # Grade the merge, not the branch, when checking by hand. CI analyzes
          # the pull request merged into main, so a checkout that has fallen
          # behind grades a different module.
          failure_score_threshold: 50

      - name: Save the tarp build cache
        if: ${{ !cancelled() && steps.gocache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/tarp-gocache
          key: tarp-gocache-${{ runner.os }}-${{ hashFiles('go.sum') }}

      - name: Upload the tarp report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: tarp-report
          path: ${{ steps.tarp.outputs.report }}
          if-no-files-found: ignore
