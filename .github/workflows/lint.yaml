---
on:
  workflow_dispatch:
  pull_request:
    paths:
      - '**/*.go'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

name: lint
jobs:
  golang:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go-version: ['1.27.x']
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install Go
        uses: actions/setup-go@v6
        with:
          go-version: '${{ matrix.go-version }}'
          cache: true
          cache-dependency-path: go.sum

      # The Makefile builds an image reference from this same file, so `make
      # lint` and this job cannot disagree about which linter ran.
      - name: Read the pinned linter version
        id: linter
        run: echo "version=$(cat .golangci-version)" >> "${GITHUB_OUTPUT}"

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: ${{ steps.linter.outputs.version }}
