---
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'authentication/oauth2server/**'
      - '.conformance/oauth2diff/**'
      - '.github/workflows/oauth2diff.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

name: oauth2diff
jobs:
  differential:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go-version: ['1.26.x']
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ matrix.go-version }}
          cache: true
          cache-dependency-path: .conformance/oauth2diff/go.sum

      # -race is not incidental here. The library's read-then-delete redemption
      # window is scheduling-dependent, and the race detector's perturbation is
      # what opens it often enough to be worth measuring.
      - name: Differential
        run: go test -race -count=1 -v ./...
        working-directory: .conformance/oauth2diff
