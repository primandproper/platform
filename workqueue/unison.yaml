sqlc_version: 1.31.1
package: workqueuedb
out: internal/workqueuedb

# The keys of `schemas:` are the dialect roster, and this one has a single key.
# workqueue is Postgres-only because the claim is — the single-statement
# RETURNING handout is the concurrency contract, see the workqueue package
# comment — and a roster of one is first class here: it renders one corpus and
# gets the same checked guarantee, with the added freedom that a shape cannot
# diverge across a roster it is alone in.
#
# The schema file lives beside its source: rendered from workqueue/migrations by
# `go run ./internal/queriesgen -schema postgres`, at the empty table prefix —
# never edited by hand.
schemas:
  postgresql: migrations/schema/postgres.sql

queries:
  postgresql: internal/queries/postgres_generated.sql

options:
  # ddl.Qualify prefixes table names from consumer config at construction; the
  # generated SQL carries {{prefix}} markers substituted once by New.
  table_prefix_var: true
