sqlc_version: 1.31.1
package: linksdb
out: internal/linksdb

# The keys of `schemas:` are the dialect roster. The schema files live beside
# their source: rendered from links/database/migrations by
# `go run ./internal/queriesgen -schema <dialect>`, at the empty table prefix —
# never edited by hand.
schemas:
  postgresql: migrations/schema/postgres.sql
  mysql: migrations/schema/mysql.sql
  sqlite: migrations/schema/sqlite.sql

queries:
  postgresql: internal/queries/postgres_generated.sql
  mysql: internal/queries/mysql_generated.sql
  sqlite: internal/queries/sqlite_generated.sql

options:
  # ddl.Qualify prefixes the table name from consumer config at construction;
  # the generated SQL carries {{prefix}} markers substituted once by New.
  table_prefix_var: true

  # No type_overrides. This table carries no tenancy.Scope — see
  # links/database/migrations — and everything else it holds is a string, a
  # blob, an integer, or an instant, which the generated types already spell.
